name: reconcile-billing-email-final

on:
  push:
    branches: [ feature/billing-email-release-gate ]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge current main and remove temporary workflow
        shell: bash
        run: |
          git config user.name "Clarity Reconcile Bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git merge -X theirs origin/main -m "Merge 0.6.8 main into billing email release gate"
          rm .github/workflows/reconcile-billing-email-final.yml
          git add -A
          git commit --amend --no-edit
          git push origin HEAD:feature/billing-email-release-gate
