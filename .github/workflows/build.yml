name: clarity-build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ClarityBelongs.slnx

      - name: Build
        run: dotnet build ClarityBelongs.slnx --configuration Release --no-restore

      - name: Automated tests
        run: dotnet test ClarityBelongs.slnx --configuration Release --no-build

      - name: Runtime, public-site, account, security, and persistence smoke test
        shell: bash
        env:
          ASPNETCORE_ENVIRONMENT: Development
          CLARITY_DB_PATH: /tmp/clarity-smoke/clarity.db
          CLARITY_BACKUP_DIR: /tmp/clarity-smoke/backups
        run: |
          rm -rf /tmp/clarity-smoke /tmp/clarity-cookies.txt
          mkdir -p /tmp/clarity-smoke

          dotnet run --project src/ClarityBelongs.Web/ClarityBelongs.Web.csproj --configuration Release --no-build --urls http://127.0.0.1:5080 > /tmp/clarity.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5080/health > /tmp/clarity-health.json; then
              break
            fi

            sleep 1
          done

          cat /tmp/clarity-health.json
          python - <<'PY'
          import json
          with open('/tmp/clarity-health.json', encoding='utf-8') as stream:
              health = json.load(stream)
          assert health['database']['reachable'] is True
          assert health['database']['schemaCurrent'] is True
          assert health['database']['writable'] is True
          PY
          ls -l "$CLARITY_DB_PATH"

          for route in / /products /products/website-change /products/website-uptime /learn /learn/how-to-monitor-a-website-for-changes /pricing /about /support /contact /feedback /privacy /terms /robots.txt /sitemap.xml; do
            echo "Checking public route $route"
            curl --fail --silent --show-error "http://127.0.0.1:5080$route" -o /tmp/clarity-public.html
          done

          echo "Checking hidden and unknown routes return 404"
          for route in /products/product-price /products/definitely-not-a-product /learn/definitely-not-a-guide /definitely-not-a-page; do
            STATUS_CODE=$(curl --silent --output /tmp/clarity-not-found.html --write-out '%{http_code}' "http://127.0.0.1:5080$route")
            echo "$route -> $STATUS_CODE"
            test "$STATUS_CODE" = "404"
          done

          echo "Checking signup page"
          curl --fail --silent --show-error \
            -c /tmp/clarity-cookies.txt \
            http://127.0.0.1:5080/signup \
            -o /tmp/clarity-signup.html

          echo "Checking login noindex"
          curl --fail --silent --show-error \
            http://127.0.0.1:5080/login \
            -o /tmp/clarity-login.html
          grep -q 'noindex, nofollow' /tmp/clarity-login.html

          echo "Checking missing-CSRF rejection"
          NO_CSRF_CODE=$(curl --silent \
            -o /tmp/clarity-no-csrf.html \
            -w '%{http_code}' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data 'displayName=Blocked&email=blocked%40claritybelongs.test&password=ClarityTest12345' \
            http://127.0.0.1:5080/auth/signup)
          echo "Missing-CSRF status: $NO_CSRF_CODE"
          test "$NO_CSRF_CODE" = "400"

          echo "Checking unauthenticated API rejection"
          UNAUTH_API_CODE=$(curl --silent \
            -o /tmp/clarity-unauth-api.json \
            -w '%{http_code}' \
            -H 'Origin: http://127.0.0.1:5080' \
            -H 'Content-Type: application/json' \
            --data '{"name":"Unauthorized","target":"https://example.com","checkCadenceMinutes":360}' \
            http://127.0.0.1:5080/api/follows)
          echo "Unauthenticated API status: $UNAUTH_API_CODE"
          case "$UNAUTH_API_CODE" in
            200|201|202|204) exit 1 ;;
          esac

          echo "Checking signup antiforgery token"
          CSRF_TOKEN=$(python - <<'PY'
          from html.parser import HTMLParser

          class TokenParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.value = None

              def handle_starttag(self, tag, attrs):
                  if tag != 'input':
                      return
                  values = dict(attrs)
                  if values.get('name') == '__RequestVerificationToken':
                      self.value = values.get('value')

          parser = TokenParser()
          with open('/tmp/clarity-signup.html', encoding='utf-8') as stream:
              parser.feed(stream.read())
          print(parser.value or '')
          PY
          )
          test -n "$CSRF_TOKEN"

          echo "Creating smoke account"
          curl --fail --silent --show-error \
            -b /tmp/clarity-cookies.txt \
            -c /tmp/clarity-cookies.txt \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "__RequestVerificationToken=$CSRF_TOKEN" \
            --data 'displayName=CI+User&email=ci%40claritybelongs.test&password=ClarityTest12345' \
            http://127.0.0.1:5080/auth/signup \
            -o /dev/null

          echo "Checking authenticated workspace"
          curl --fail --silent --show-error \
            -b /tmp/clarity-cookies.txt \
            http://127.0.0.1:5080/my-clarity \
            -o /tmp/clarity-dashboard.html

          echo "Checking account noindex"
          curl --fail --silent --show-error \
            -b /tmp/clarity-cookies.txt \
            http://127.0.0.1:5080/account \
            -o /tmp/clarity-account.html
          grep -q 'noindex, nofollow' /tmp/clarity-account.html

          echo "Checking bad follow ID has coherent empty state"
          curl --fail --silent --show-error \
            -b /tmp/clarity-cookies.txt \
            http://127.0.0.1:5080/follows/999999999 \
            -o /tmp/clarity-missing-follow.html
          grep -q 'That follow is not available' /tmp/clarity-missing-follow.html

          echo "Creating smoke follow"
          curl --fail --silent --show-error \
            -b /tmp/clarity-cookies.txt \
            -H 'Origin: http://127.0.0.1:5080' \
            -H 'Content-Type: application/json' \
            --data '{"name":"CI Example","target":"https://example.com","checkCadenceMinutes":360}' \
            http://127.0.0.1:5080/api/follows \
            -o /tmp/clarity-follow.json

          grep -q '"id"' /tmp/clarity-follow.json

          echo "Checking private-target rejection"
          PRIVATE_TARGET_CODE=$(curl --silent \
            -b /tmp/clarity-cookies.txt \
            -o /tmp/clarity-private-target.json \
            -w '%{http_code}' \
            -H 'Origin: http://127.0.0.1:5080' \
            -H 'Content-Type: application/json' \
            --data '{"name":"Blocked target","target":"http://127.0.0.1","checkCadenceMinutes":360}' \
            http://127.0.0.1:5080/api/follows)
          echo "Private-target status: $PRIVATE_TARGET_CODE"
          test "$PRIVATE_TARGET_CODE" = "400"
          grep -q 'could not be created' /tmp/clarity-private-target.json

          kill $APP_PID
          wait $APP_PID || true
          trap - EXIT

          echo "Creating database backup"
          dotnet run --project src/ClarityBelongs.Web/ClarityBelongs.Web.csproj --configuration Release --no-build -- --backup-database > /tmp/clarity-backup.log
          cat /tmp/clarity-backup.log
          ls "$CLARITY_BACKUP_DIR"/clarity-*.db > /dev/null

          echo "Restarting against persisted database"
          dotnet run --project src/ClarityBelongs.Web/ClarityBelongs.Web.csproj --configuration Release --no-build --urls http://127.0.0.1:5080 > /tmp/clarity-restart.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5080/health > /tmp/clarity-restart-health.json; then
              break
            fi

            sleep 1
          done

          python - <<'PY'
          import json
          with open('/tmp/clarity-restart-health.json', encoding='utf-8') as stream:
              health = json.load(stream)
          assert health['database']['schemaCurrent'] is True
          assert health['database']['reachable'] is True
          assert health['database']['writable'] is True
          assert health['database']['lastBackupUtc'] is not None
          PY
          curl --fail --silent --show-error \
            -b /tmp/clarity-cookies.txt \
            http://127.0.0.1:5080/my-clarity \
            -o /tmp/clarity-restart-dashboard.html
          grep -q 'CI Example' /tmp/clarity-restart-dashboard.html
