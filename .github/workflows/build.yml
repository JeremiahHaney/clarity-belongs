name: clarity-build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ClarityBelongs.slnx

      - name: Build
        run: dotnet build ClarityBelongs.slnx --configuration Release --no-restore

      - name: Automated tests
        run: dotnet test ClarityBelongs.slnx --configuration Release --no-build

      - name: Runtime, public-site, account, and security smoke test
        shell: bash
        env:
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          rm -f src/ClarityBelongs.Web/clarity.db /tmp/clarity-cookies.txt
          dotnet run --project src/ClarityBelongs.Web/ClarityBelongs.Web.csproj --configuration Release --no-build --urls http://127.0.0.1:5080 > /tmp/clarity.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5080/health > /tmp/clarity-health.json; then
              break
            fi

            sleep 1
          done

          cat /tmp/clarity-health.json

          for route in / /products /products/website-change /learn /learn/how-to-monitor-a-website-for-changes /pricing /about /support /privacy /terms /robots.txt /sitemap.xml; do
            curl --fail --silent --show-error "http://127.0.0.1:5080$route" -o /tmp/clarity-public.html
          done

          curl --fail --silent --show-error \
            -c /tmp/clarity-cookies.txt \
            http://127.0.0.1:5080/signup \
            -o /tmp/clarity-signup.html

          curl --fail --silent --show-error \
            http://127.0.0.1:5080/login \
            -o /tmp/clarity-login.html
          grep -q 'noindex, nofollow' /tmp/clarity-login.html

          NO_CSRF_CODE=$(curl --silent \
            -o /tmp/clarity-no-csrf.html \
            -w '%{http_code}' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data 'displayName=Blocked&email=blocked%40claritybelongs.test&password=ClarityTest12345' \
            http://127.0.0.1:5080/auth/signup)
          test "$NO_CSRF_CODE" = "400"

          UNAUTH_API_CODE=$(curl --silent \
            -o /tmp/clarity-unauth-api.json \
            -w '%{http_code}' \
            -H 'Origin: http://127.0.0.1:5080' \
            -H 'Content-Type: application/json' \
            --data '{"name":"Unauthorized","target":"https://example.com","checkCadenceMinutes":360}' \
            http://127.0.0.1:5080/api/follows)
          case "$UNAUTH_API_CODE" in
            200|201|202|204) exit 1 ;;
          esac

          CSRF_TOKEN=$(sed -n 's/.*name="__RequestVerificationToken" type="hidden" value="\([^"]*\)".*/\1/p' /tmp/clarity-signup.html | head -1)
          test -n "$CSRF_TOKEN"

          curl --fail --silent --show-error \
            -b /tmp/clarity-cookies.txt \
            -c /tmp/clarity-cookies.txt \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "__RequestVerificationToken=$CSRF_TOKEN" \
            --data 'displayName=CI+User&email=ci%40claritybelongs.test&password=ClarityTest12345' \
            http://127.0.0.1:5080/auth/signup \
            -o /dev/null

          curl --fail --silent --show-error \
            -b /tmp/clarity-cookies.txt \
            http://127.0.0.1:5080/my-clarity \
            -o /tmp/clarity-dashboard.html

          curl --fail --silent --show-error \
            -b /tmp/clarity-cookies.txt \
            http://127.0.0.1:5080/account \
            -o /tmp/clarity-account.html
          grep -q 'noindex, nofollow' /tmp/clarity-account.html

          curl --fail --silent --show-error \
            -b /tmp/clarity-cookies.txt \
            -H 'Origin: http://127.0.0.1:5080' \
            -H 'Content-Type: application/json' \
            --data '{"name":"CI Example","target":"https://example.com","checkCadenceMinutes":360}' \
            http://127.0.0.1:5080/api/follows \
            -o /tmp/clarity-follow.json

          grep -q '"id"' /tmp/clarity-follow.json

          PRIVATE_TARGET_CODE=$(curl --silent \
            -b /tmp/clarity-cookies.txt \
            -o /tmp/clarity-private-target.json \
            -w '%{http_code}' \
            -H 'Origin: http://127.0.0.1:5080' \
            -H 'Content-Type: application/json' \
            --data '{"name":"Blocked target","target":"http://127.0.0.1","checkCadenceMinutes":360}' \
            http://127.0.0.1:5080/api/follows)
          test "$PRIVATE_TARGET_CODE" = "400"
          grep -q 'could not be created' /tmp/clarity-private-target.json
