name: Refresh AI repository index
on:
  push:
    branches: [main]
    paths-ignore:
      - AI_CAPABILITIES.generated.json
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ai-repository-index
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate source index
        run: python scripts/generate-ai-index.py
      - name: Commit index only when changed
        run: |
          if git diff --quiet -- AI_CAPABILITIES.generated.json && [ -z "$(git ls-files --others --exclude-standard -- AI_CAPABILITIES.generated.json)" ]; then
            echo "Index unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AI_CAPABILITIES.generated.json
          git commit -m "docs: refresh AI source inventory [skip ci]"
          git push
