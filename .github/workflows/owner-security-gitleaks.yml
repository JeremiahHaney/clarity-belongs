name: Owner security Gitleaks inventory
on:
  workflow_dispatch:
  schedule:
    - cron: '18 9 * * *'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: owner-security-gitleaks-${{ github.repository }}
  cancel-in-progress: false

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install pinned Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.24.3

      - name: Scan Git history
        shell: bash
        run: |
          "$(go env GOPATH)/bin/gitleaks" git . \
            --report-format json \
            --report-path "$RUNNER_TEMP/gitleaks.json" \
            --exit-code 0 \
            --no-banner
          if [ ! -f "$RUNNER_TEMP/gitleaks.json" ]; then
            echo '[]' > "$RUNNER_TEMP/gitleaks.json"
          fi

      - name: Send sanitized findings if configured
        env:
          APIT_SECURITY_INGEST_KEY: ${{ secrets.APIT_SECURITY_INGEST_KEY }}
        run: |
          if [ -z "$APIT_SECURITY_INGEST_KEY" ]; then
            echo "::warning::Configure APIT_SECURITY_INGEST_KEY and the matching repository-scoped APIT server setting to enable ingestion."
            exit 0
          fi
          python3 .github/scripts/send-owner-security-gitleaks.py "$RUNNER_TEMP/gitleaks.json"
