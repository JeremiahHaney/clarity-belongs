name: migration-probe

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore ClarityBelongs.slnx
      - run: rm -rf src/ClarityBelongs.Web/Migrations
      - run: dotnet build ClarityBelongs.slnx --configuration Release --no-restore
      - run: dotnet tool install --global dotnet-ef --version 10.0.0
      - name: Generate canonical baseline
        shell: bash
        run: |
          dotnet ef migrations add InitialClarityBaseline \
            --project src/ClarityBelongs.Web \
            --startup-project src/ClarityBelongs.Web \
            --output-dir Migrations \
            --configuration Release \
            --no-build

          MIGRATION_FILE=$(find src/ClarityBelongs.Web/Migrations -maxdepth 1 -type f -name '*_InitialClarityBaseline.cs' ! -name '*.Designer.cs' | head -1)
          MIGRATION_ID=$(basename "$MIGRATION_FILE" .cs)
          test -n "$MIGRATION_ID"

          sed -i -E \
            's/public const string BaselineMigrationId = "[^"]+";/public const string BaselineMigrationId = "'"$MIGRATION_ID"'";/' \
            src/ClarityBelongs.Web/Data/DatabaseSchemaService.cs

      - name: Validate generated baseline
        run: dotnet test ClarityBelongs.slnx --configuration Release

      - name: Commit canonical baseline and remove probe
        shell: bash
        run: |
          rm .github/workflows/migration-probe.yml
          git config user.name "Clarity Migration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A src/ClarityBelongs.Web/Migrations src/ClarityBelongs.Web/Data/DatabaseSchemaService.cs .github/workflows/migration-probe.yml
          git commit -m "Finalize EF Core migration baseline"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
