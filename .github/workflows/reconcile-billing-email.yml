name: reconcile-billing-email

on:
  push:
    branches: [ feature/billing-email-release-gate ]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge current main preserving concurrent work
        shell: bash
        run: |
          git config user.name "Clarity Reconcile Bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git merge -X theirs origin/main -m "Merge current main into billing email release gate"
          git push origin HEAD:feature/billing-email-release-gate
